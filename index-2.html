<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Mixed by Maxym — Mix & Master</title>
  <meta name="description" content="Mix i master dla artystów. Szybkie terminy, profesjonalny sound: Avalon, Tube-Tech, 1176 (UAD), FabFilter, Soundtoys. Wyślij stemsy lub projekt Logic Pro."/>
  <meta name="color-scheme" content="dark"/>
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0b0d10">
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Michroma&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0b0d10; --ink:#eef2f6; --muted:#a4adb7;
      --acc:#E6B10A; --line:#1a2028; --max: 960px; --radius: 999px;
      --reveal-dur:.45s; --mask-dur:.45s; --reveal-shift:24px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--ink);
      font:18px/1.5 'Barlow Condensed', ui-sans-serif, system-ui;
      letter-spacing:.15px;overflow-x:hidden;}
    a{color:inherit;text-decoration:none}

    .backdrop{position:fixed;inset:0;z-index:-2}
    .backdrop::before{
      content:"";position:absolute;inset:0;
      background:url('assets/bg.webp') center/cover no-repeat;
      opacity:.44; filter:contrast(1.05) saturate(.9) brightness(.9);
    }
    .grid{position:absolute;inset:0;mix-blend-mode:overlay;pointer-events:none;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.11) 0 1px, transparent 1px 22px),
        repeating-linear-gradient(90deg, rgba(255,255,255,.11) 0 1px, transparent 1px 22px);
      opacity:.2;animation:blink var(--reveal-dur) steps(12,end) infinite,
                 jitter 6s ease-in-out infinite alternate;}
    @keyframes blink{50%{opacity:.13}}
    @keyframes jitter{from{transform:translate3d(0,0,0)}to{transform:translate3d(-1.1%,-1.1%,0)}}
    .grain{position:absolute;inset:-15%;mix-blend-mode:soft-light;opacity:.22;pointer-events:none}
    .grain svg{width:100%;height:100%}

    main{max-width:var(--max);margin-inline:auto;padding:0 22px}
    .section{padding:96px 0;text-align:center;margin-inline:auto}
    .title{font-family:'Michroma', system-ui;font-weight:700;letter-spacing:.02em;
      font-size:clamp(36px,5.6vw,62px);margin:0 0 16px}
    .lead{color:var(--muted);font-size:clamp(18px,2.2vw,22px);margin:0 auto;max-width:70ch}
    .cta{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .btn{padding:12px 20px;border-radius:var(--radius);border:1px solid var(--line);
      background:rgba(12,15,20,.75);font-weight:700;letter-spacing:.6px}
    .btn.acc{background:var(--acc);border-color:transparent;color:#111;box-shadow:0 8px 30px rgba(230,177,10,.25)}

    .hero{min-height:92vh;display:flex;align-items:center;justify-content:center;
      text-align:center;}
    .logo-box{width:min(232px,44vw);aspect-ratio:1/1;margin-inline:auto;
      background:url('assets/logo-mm.svg') center/contain no-repeat;
      filter:drop-shadow(0 18px 32px rgba(0,0,0,.5));display:block}
    @supports not (aspect-ratio:1/1){.logo-box{width:min(232px,44vw);height:min(232px,44vw)}}

    .offer{display:grid;grid-template-columns:1fr;gap:30px;margin-top:14px}
    .off-item h3{font-family:'Michroma', system-ui;margin:0 0 6px;font-size:28px;letter-spacing:.02em}
    .off-item p{margin:0;color:var(--muted)}
    .price{margin-top:8px;font-weight:800;letter-spacing:.6px}

    .reveal{--d:0ms;opacity:0;transform:translateY(var(--reveal-shift)) scale(.985);filter:blur(1px)}
    .reveal.in{opacity:1;transform:none;filter:none;
      transition:opacity var(--reveal-dur) ease var(--d),
                 transform var(--reveal-dur) ease var(--d),
                 filter var(--reveal-dur) ease var(--d)}
    .mask{display:inline-block;position:relative;--p:0%}
    .mask.animate{animation:unmask var(--mask-dur) ease forwards var(--d)}
    @keyframes unmask{0%{letter-spacing:.12em;opacity:.6}100%{letter-spacing:.02em;opacity:1}}
    .mask>span{background:linear-gradient(90deg, rgba(230,177,10,.95), rgba(230,177,10,.95)) no-repeat;
      -webkit-background-clip:text;background-clip:text;color:transparent;
      -webkit-mask:linear-gradient(90deg,#000 0 var(--p),transparent var(--p) 100%);
      mask:linear-gradient(90deg,#000 0 var(--p),transparent var(--p) 100%);
      animation:revealbar var(--mask-dur) ease forwards var(--d)}
    @keyframes revealbar{from{--p:0%}to{--p:100%}}
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="grid"></div>
    <div class="grain" aria-hidden="true">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none">
        <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5">
          <animate attributeName="baseFrequency" values="0.7;0.95;0.8;0.9" dur="10s" repeatCount="indefinite"/></feTurbulence>
          <feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 0.55"/></feComponentTransfer></filter>
        <rect width="100%" height="100%" filter="url(#n)"/>
      </svg>
    </div>
  </div>
  <header class="hero">
    <div class="logo-box reveal" style="--d:40ms" role="img" aria-label="Mixed by Maxym"></div>
  </header>
  <main>
    <!-- oferta etc (skrócone dla zip) -->
    <section class="section reveal" id="oferta">
      <h2 class="title"><span class="mask animate"><span>Oferta</span></span></h2>
    </section>
  </main>
  <footer class="section"><p class="lead" style="text-align:center">© <span id="y"></span> Mixed by Maxym</p></footer>
  <script>
    window.history.scrollRestoration='manual';
    window.addEventListener('load',()=>{setTimeout(()=>window.scrollTo(0,0),0)});
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.07});
    document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
    document.getElementById('y').textContent=new Date().getFullYear();
  </script>
</body>
</html>
